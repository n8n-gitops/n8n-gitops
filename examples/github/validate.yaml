name: n8n Validate on PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'n8n/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install n8n-gitops
        run: pip install n8n-gitops

      - name: Validate workflows
        run: n8n-gitops validate --strict
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY:  ${{ secrets.N8N_API_KEY }}

      - name: Dry-run deploy
        run: n8n-gitops deploy --dry-run
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY:  ${{ secrets.N8N_API_KEY }}